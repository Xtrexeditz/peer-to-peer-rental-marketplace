<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEasy - List Your Item</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="speed-insights.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="logo"><h1>RentEasy</h1></div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#items">Items</a></li>
                <li class="active"><a href="list-item.html" id="listItemLink">List Item</a></li>
                <li><a href="login.html" id="authLink">Login / Signup</a></li>
            </ul>
        </nav>
    </header>

    <section class="list-section" style="display: block;">
        <h2 class="section-title">List Your Item</h2>
        <div class="form-container">
            <form id="addItemForm">
                <div class="form-group">
                    <label for="newItemName">Item Name</label>
                    <input type="text" id="newItemName" placeholder="e.g. High-Performance Laptop" required>
                </div>
                <div class="form-group">
                    <label for="newItemPrice">Price/Day ($)</label>
                    <input type="number" id="newItemPrice" min="1" placeholder="e.g. 20" required>
                </div>
                <div class="form-group">
                    <label for="newItemCategory">Category</label>
                    <select id="newItemCategory" required>
                        <option value="Electronics">Electronics</option>
                        <option value="Tools">Tools</option>
                        <option value="Vehicles">Vehicles</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="newItemDescription">Description</label>
                    <textarea id="newItemDescription" placeholder="Describe your item (e.g. technical specs, condition, accessories)..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="newItemLocation">Pickup Location / Address</label>
                    <input type="text" id="newItemLocation" placeholder="e.g. Block C, Room 102 or Hostel 4" required>
                </div>
                <div class="form-group">
                    <label for="newItemPhone">Mobile Number</label>
                    <input type="tel" id="newItemPhone" placeholder="e.g. +91 9876543210" required>
                </div>
                <div class="form-group">
                    <label for="newItemImage">Item Image</label>
                    <input type="file" id="newItemImage" accept="image/*">
                </div>
                <button type="submit" class="submit-btn">List Item</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 RentEasy. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
