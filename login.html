<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEasy - Authenticate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="speed-insights.js"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <h2 id="authTitle">Login</h2>
        <p class="login-subtitle" id="authSubtitle">Sign in to rent campus items</p>
        
        <form id="authForm">
            <div class="form-group" id="nameGroup" style="display:none;">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
            </div>
            <div class="form-group" id="addressGroup" style="display:none;">
                <label for="address">Campus Address / Hostel Room</label>
                <input type="text" id="address" placeholder="e.g. Hostel 4, Room 102">
            </div>
            <div class="form-group">
                <label for="email">College Email ID</label>
                <input type="email" id="email" placeholder="student@college.edu" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="submit-btn" id="authSubmitBtn">Sign In</button>
        </form>
        
        <div class="login-links">
            <a href="#" id="toggleAuthMode">Don't have an account? Sign Up</a><br><br>
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
