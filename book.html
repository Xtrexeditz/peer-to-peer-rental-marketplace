<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEasy - Book Item</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><h1>RentEasy</h1></div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#items">Items</a></li>
                <li><a href="list-item.html" id="listItemLink">List Item</a></li>
                <li><a href="login.html" id="authLink">Login / Signup</a></li>
            </ul>
        </nav>
    </header>

    <section class="booking-section" style="display: block;">
        <h2 class="section-title">Book an Item</h2>
        
        <div class="form-container" id="bookingFormContainer">
            <form id="bookingForm">
                <div class="form-group">
                    <label for="userName">Full Name</label>
                    <input type="text" id="userName" placeholder="Enter name" required>
                </div>
                <div class="form-group">
                    <label for="userAddress">Address</label>
                    <input type="text" id="userAddress" placeholder="Hostel/Room No." required>
                </div>
                <div class="form-group">
                    <label for="userPhone">Mobile Number</label>
                    <input type="tel" id="userPhone" placeholder="Enter mobile number" required>
                </div>
                <div class="form-group">
                    <label for="itemName">Item</label>
                    <select id="itemName" required>
                        <option value="" disabled selected>Select an item</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rentalDays">Duration (Days)</label>
                    <input type="number" id="rentalDays" min="1" max="30" placeholder="e.g. 3" required>
                </div>
                
                <div class="cost-display" id="costCalculator" style="display: none;">
                    Estimated Cost: $<span id="estimatedCost">0</span>
                </div>
                
                <button type="submit" class="submit-btn">Submit Booking</button>
            </form>
        </div>

        <div id="receipt" class="receipt-paper" style="display: none;">
            <h3>Rental Receipt</h3>
            <hr style="margin: 15px 0; border: 1px dashed #cbd5e0;">
            <p><strong>Renter Name:</strong> <span id="recName"></span></p>
            <p><strong>Address:</strong> <span id="recAddress"></span></p>
            <p><strong>Mobile No:</strong> <span id="recPhone"></span></p>
            <p><strong>Item Name:</strong> <span id="recItem"></span></p>
            <p><strong>Rental Period:</strong> <span id="recDays"></span> day(s)</p>
            <p><strong>Total Cost:</strong> $<span id="recTotal"></span></p>
            <div class="receipt-actions">
                <button class="submit-btn" style="background: #4f46e5;" onclick="window.print()">Print Receipt</button>
                <button class="submit-btn" style="background: #64748b;" onclick="window.location.href='index.html'">Go Back Home</button>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 RentEasy. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
